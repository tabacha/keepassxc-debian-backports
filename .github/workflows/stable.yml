# Stable-Suite: baut die Version aus VERSION/REVISION, wenn sich auf main etwas
# Relevantes ändert. Veröffentlichung erst nach Freigabe in der Environment "release".
name: stable

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - REVISION
      - config.env
      - patches/**
      - packaging/**
      - keys/repo-stable.asc
      - scripts/**
      - .github/workflows/build.yml
      - .github/workflows/publish.yml
      - .github/workflows/stable.yml
  workflow_dispatch:

permissions: {}

# Ein neuer Push auf main bricht laufende oder auf Freigabe wartende stable-Läufe ab;
# es läuft immer nur der neueste. Unbedenklich, weil publish.yml gh-pages erst im
# letzten Schritt mit einem einzigen Push aktualisiert.
concurrency:
  group: stable
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      suite: stable
      check_state: true

  attest:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/attest.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      suite: stable

  publish:
    needs: [build, attest]
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    # Ohne Weitergabe sieht der aufgerufene Workflow auch die Environment-Secrets
    # nicht (leerer Wert). Der Key liegt nur in der Environment "release".
    secrets: inherit
    with:
      suite: stable
      environment: release
