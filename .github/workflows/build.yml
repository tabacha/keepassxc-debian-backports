# Wiederverwendbarer Build: Source-Paket -> Binärpakete (amd64, arm64) mit Tests -> Smoke-Test.
# Läuft OHNE Zugriff auf Signing-Secrets.
name: build

on:
  workflow_call:
    inputs:
      suite:
        description: stable | snapshot
        type: string
        required: true
      check_state:
        description: Mit veröffentlichtem Stand vergleichen und ggf. überspringen
        type: boolean
        default: false
    outputs:
      changed:
        value: ${{ jobs.source.outputs.changed }}
      version:
        value: ${{ jobs.source.outputs.version }}
      upstream:
        value: ${{ jobs.source.outputs.upstream }}

permissions:
  contents: read

# In Container-Jobs wäre der Default "sh" (dash); die Skripte brauchen bash.
defaults:
  run:
    shell: bash

jobs:
  source:
    name: source (${{ inputs.suite }})
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      version: ${{ steps.meta.outputs.version }}
      upstream: ${{ steps.meta.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-deps.sh source
      - name: Source-Paket erzeugen
        env:
          GITHUB_TOKEN: ${{ github.token }}   # nur gegen API-Rate-Limits, read-only
          SUITE: ${{ inputs.suite }}
        run: scripts/prepare-source.sh "$SUITE" out/source
      - id: meta
        run: |
          . scripts/lib.sh
          gh_output version  "$(meta_get out/source/meta.env PACKAGE_VERSION)"
          gh_output upstream "$(meta_get out/source/meta.env UPSTREAM_VERSION)"
      - id: state
        env:
          CHECK_STATE: ${{ inputs.check_state }}
        run: |
          if [ "$CHECK_STATE" = true ]; then
            scripts/check-state.sh out/source/meta.env
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ inputs.suite }}
          path: out/source/
          if-no-files-found: error

  binary:
    name: binary (${{ inputs.suite }}, ${{ matrix.arch }})
    needs: source
    if: needs.source.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04,     mode: full }
          - { arch: arm64, runner: ubuntu-24.04-arm, mode: any }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-${{ inputs.suite }}
          path: source
      - run: scripts/install-deps.sh binary
      - name: Bauen und testen
        env:
          MODE: ${{ matrix.mode }}
        run: scripts/build-binary.sh source debs "$MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs-${{ inputs.suite }}-${{ matrix.arch }}
          path: debs/
          if-no-files-found: error

  smoke:
    name: smoke (${{ inputs.suite }}, ${{ matrix.arch }})
    needs: binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debs-${{ inputs.suite }}-*
          path: debs
          merge-multiple: true
      - run: scripts/install-deps.sh smoke
      - name: Nur Pakete dieser Architektur + all testen
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir smoke
          cp debs/*_"$ARCH".deb debs/*_all.deb smoke/ 2>/dev/null || cp debs/*_"$ARCH".deb smoke/
      - run: scripts/smoke-test.sh smoke
