# Wiederverwendbar: Build-Provenance (SLSA) für die gebauten Pakete.
# Eigener Job, damit nur dieser ein OIDC-Token bekommt, nicht der Build mit Upstream-Code.
name: attest

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debs-${{ inputs.suite }}-*
          path: debs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-${{ inputs.suite }}
          path: source
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            debs/*.deb
            source/*.dsc
            source/*.tar.*
